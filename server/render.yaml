# Render Blueprint — deploy from repo with rootDir = server (or link this file).
# https://render.com/docs/blueprint-spec
#
# Free / low-RAM default:
#   - Heavy OSS OFF (Semgrep, Playwright, Cover-Agent, ZAP, Locust)
#   - Hypothesis ON (light pytest — QA_OSS_ADAPTERS=0 means "Hypothesis only")
# Re-enable full suite after ≥1GB + paid customer:
#   buildCommand: … && bash scripts/install-oss-tools.sh
#   QA_OSS_ADAPTERS=1, CANARY_OSS_ADAPTERS=1, OSS_TOOLS_REQUIRED=1

services:
  - type: web
    name: agentos-api
    runtime: node
    rootDir: server
    plan: standard
    buildCommand: npm install && npm run build && (python3 -m pip install --user pytest hypothesis || python -m pip install --user pytest hypothesis || true)
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: AUTH_JWT_SECRET
        generateValue: true
      # Canonical domain first — FRONTEND_URL drives OAuth redirects (Google, GitHub, Jira)
      - key: CORS_ORIGIN
        value: https://agentox.io,https://www.agentox.io,https://agentos-blue.vercel.app
      - key: FRONTEND_URL
        value: https://agentox.io
      - key: PUBLIC_API_URL
        value: https://agentos-sc05.onrender.com
      # Light mode: Hypothesis only (no Semgrep / Playwright / Cover-Agent)
      - key: QA_OSS_ADAPTERS
        value: "0"
      # Free-tier: do not run Playwright monitor / ZAP / Locust on Canary
      - key: CANARY_OSS_ADAPTERS
        value: "0"
      # Soft-skip missing heavy CLIs; Hypothesis still runs when Python tests exist
      - key: OSS_TOOLS_REQUIRED
        value: "0"
      # Skip npm install in Ananta workspace on small instances
      - key: ENGINEERING_SKIP_NPM_INSTALL
        value: "1"
